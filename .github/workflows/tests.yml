name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York  # reports use local time; run under a zone with DST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v
      - run: python tools/check_public.py  # nothing personal in a public repo
